services:
  database:
    image: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
        - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
    - "5000:5000"  
    env_file: 
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - database
 
volumes:
  pgdata: