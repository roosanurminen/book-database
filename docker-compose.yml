services:
  database:
    image: postgres
    ports:
      - "5432:5432" # Maybe delete the whole ports part in prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
        - pgdata:/var/lib/postgresql/data

  # Delete this frontend when production    

  backend:
    build: ./backend
    ports:
    - "5000:5000"  # delete maybe this ports part wholely
    env_file: 
      - .env
    environment:
      - NODE_ENV=development # change to NODE_ENV=production
    depends_on:
      - database

